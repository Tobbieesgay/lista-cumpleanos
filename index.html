<!doctype html>
<html lang="es-419">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de Cumpleaños</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf6ee; --card: #ffffff; --ink: #2b2118; --muted: #7a6a5c;
    --accent: #e8643c; --accent-ink: #ffffff; --line: #eadfd2; --done: #9bb59a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1712; --card: #2a221b; --ink: #f5ece2; --muted: #b5a493;
            --accent: #f07a52; --line: #3d3228; --done: #6f8f6e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: Inter, system-ui, sans-serif; line-height: 1.5; }
  header { padding: 48px 16px 24px; text-align: center; }
  h1 { font-family: Fraunces, serif; font-weight: 800; font-size: clamp(2rem, 7vw, 3.2rem);
       margin: 0 0 8px; letter-spacing: -0.02em; }
  header p { margin: 0 auto; max-width: 520px; color: var(--muted); }
  main { max-width: 960px; margin: 0 auto; padding: 0 16px 64px;
         display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
          overflow: hidden; display: flex; flex-direction: column; }
  .card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: var(--line); }
  .body { padding: 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .name { font-family: Fraunces, serif; font-weight: 600; font-size: 1.2rem; margin: 0; }
  .note { color: var(--muted); font-size: .92rem; margin: 0; white-space: pre-line; }
  .actions { margin-top: auto; display: flex; gap: 8px; padding-top: 8px; }
  a.link, button { flex: 1; text-align: center; padding: 10px 12px; border-radius: 10px;
         font: 600 .95rem Inter, sans-serif; cursor: pointer; text-decoration: none; }
  a.link { border: 1px solid var(--line); color: var(--ink); }
  button { border: 0; background: var(--accent); color: var(--accent-ink); }
  button:disabled { background: var(--done); cursor: default; }
  .card.reserved img { filter: grayscale(.8); opacity: .6; }
  .status { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 32px 0; }
  dialog { border: 0; border-radius: 16px; padding: 24px; max-width: 360px; width: calc(100% - 32px);
           background: var(--card); color: var(--ink); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  #photo { padding: 0; max-width: min(92vw, 720px); width: auto; background: transparent; }
  #photo::backdrop { background: rgba(0,0,0,.85); }
  #photo img { display: block; max-width: 100%; max-height: 85vh; border-radius: 12px; }
  #photo button { display: block; margin: 12px auto 0; flex: none; padding: 10px 24px; }
  dialog input { width: 100%; padding: 10px; margin: 12px 0; border-radius: 10px;
                 border: 1px solid var(--line); font: inherit; background: var(--bg); color: var(--ink); }
  dialog .row { display: flex; gap: 8px; }
  dialog .cancel { background: transparent; color: var(--ink); border: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <p id="subtitle"></p>
</header>
<main id="list"><div class="status">Cargando…</div></main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <strong id="dlgTitle"></strong>
    <input id="who" placeholder="Tu nombre (solo lo ve el cumpleañero)" required maxlength="60">
    <div class="row">
      <button type="button" class="cancel" id="cancel">Cancelar</button>
      <button type="submit">Apartar</button>
    </div>
  </form>
</dialog>

<dialog id="photo">
  <img id="photoImg" alt="">
  <button type="button" id="photoClose">Cerrar</button>
</dialog>

<script>
// ===== Edita esto =====
const CONFIG = {
  title: "Mi Lista de Cumpleaños",
  subtitle: "Si quieres darme algo, aquí tienes algunas ideas. Toca “Apartar” para que nadie compre el mismo regalo dos veces.",
  // Pega aquí la URL de tu Web App de Google Apps Script (ver README):
  apiUrl: "",
};

// Tus regalos. Cada uno necesita un id único que nunca cambie.
const GIFTS = [
  { id: "mantequilla-corporal", name: "Mantequilla corporal", link: "https://www.virensyala.com/products/mantequilla-corporal-esencia-de-la-diosa", image: "", note: "Me encanta cuidarme la piel, y esta huele a rosas 🌹" },
  { id: "camiseta-bayern", name: "Camiseta Bayern Luis Díaz", link: "", image: "fotos/camiseta-bayern.jpg", note: "Para alentar a Lucho en cada partido ⚽" },
  { id: "soma-sculpt", name: "Fibra Soma Sculpt", link: "https://usasoma.com/products/soma-sculpt?variant=45650513952825", image: "", note: "Para cuidarme por dentro también 💪\n🎁 Tiene 5% de descuento en tu primera compra." },
  { id: "cojin-lumbar", name: "Cojín lumbar", link: "https://articulo.mercadolibre.com.co/MCO-1503556883?attributes=Negro_47aa3ad_vpp:R3Jpcw==", image: "", note: "Para cuidar mi espalda en las largas horas de trabajo 💺" },
  { id: "sudadera", name: "Sudadera", link: "https://greenfit.com.co/products/sudadera-vinil-dol-apt?variant=47274751721728", image: "", note: "Para entrenar cómoda y con estilo 🏃‍♀️\n📏 Talla M" },
];
// =======================

document.getElementById("title").textContent = CONFIG.title;
document.getElementById("subtitle").textContent = CONFIG.subtitle;
const list = document.getElementById("list");
const dlg = document.getElementById("dlg");
let current = null;

const localReserved = new Set();

async function load() {
  let reserved = new Set(localReserved);
  if (CONFIG.apiUrl) {
    try {
      const r = await fetch(CONFIG.apiUrl + "?action=list");
      const data = await r.json();
      (data.reserved || []).forEach(id => reserved.add(String(id)));
    } catch (e) {
      list.innerHTML = '<div class="status">No se pudo cargar la lista. Intenta recargar la página.</div>';
      return;
    }
  }
  render(GIFTS.map(g => ({ ...g, reserved: reserved.has(String(g.id)) })));
}

function render(items) {
  list.innerHTML = "";
  if (!items.length) { list.innerHTML = '<div class="status">Todavía no hay regalos.</div>'; return; }
  for (const it of items) {
    const card = document.createElement("article");
    card.className = "card" + (it.reserved ? " reserved" : "");
    const body = document.createElement("div"); body.className = "body";
    const h = document.createElement("h2"); h.className = "name"; h.textContent = it.name;
    body.appendChild(h);
    if (it.note) { const p = document.createElement("p"); p.className = "note"; p.textContent = it.note; body.appendChild(p); }
    const actions = document.createElement("div"); actions.className = "actions";
    if (it.link) {
      const a = document.createElement("a"); a.className = "link"; a.href = it.link;
      a.target = "_blank"; a.rel = "noopener"; a.textContent = "Ver";
      actions.appendChild(a);
    } else if (it.image) {
      const a = document.createElement("a"); a.className = "link"; a.href = it.image;
      a.textContent = "Ver";
      a.onclick = (e) => { e.preventDefault(); showPhoto(it); };
      actions.appendChild(a);
    }
    const b = document.createElement("button");
    b.textContent = it.reserved ? "Apartado ✓" : "Apartar";
    b.disabled = !!it.reserved;
    b.onclick = () => { current = it; document.getElementById("dlgTitle").textContent = "¿Apartar “" + it.name + "”?"; dlg.showModal(); };
    actions.appendChild(b);
    body.appendChild(actions);
    card.appendChild(body);
    list.appendChild(card);
  }
}

document.getElementById("cancel").onclick = () => dlg.close();

const photo = document.getElementById("photo");
function showPhoto(it) {
  const img = document.getElementById("photoImg");
  img.src = it.image; img.alt = it.name;
  photo.showModal();
}
document.getElementById("photoClose").onclick = () => photo.close();
photo.addEventListener("click", (e) => { if (e.target === photo) photo.close(); });
document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const who = document.getElementById("who").value.trim();
  if (!who || !current) return;
  dlg.close();
  if (!CONFIG.apiUrl) { localReserved.add(String(current.id)); return load(); }
  try {
    const url = CONFIG.apiUrl + "?action=reserve&id=" + encodeURIComponent(current.id) + "&who=" + encodeURIComponent(who);
    const r = await fetch(url);
    const data = await r.json();
    if (!data.ok) alert(data.error === "taken" ? "¡Alguien acaba de apartar este regalo!" : "Algo salió mal, intenta de nuevo.");
  } catch (e) { alert("Algo salió mal, intenta de nuevo."); }
  load();
};

load();
</script>
</body>
</html>
