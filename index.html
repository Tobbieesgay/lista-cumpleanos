<!doctype html>
<html lang="es-419">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Lista de Cumpleaños</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Una invitación impresa: título en Bodoni, tarjeta de la fiesta con doble filete dorado, y la lista como un menú elegante */
  :root {
    --bg: #f7eef0;        /* pétalo */
    --paper: #fffafb;
    --ink: #2b1630;       /* berenjena */
    --muted: #7b6372;
    --wine: #7a1f3d;
    --wine-ink: #fff6f8;
    --gold: #a9834a;
    --line: #e6d4da;
    --serif: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
    --sans: "Jost", "Futura", "Avenir Next", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a0f1c; --paper: #24162a; --ink: #f4e7ed; --muted: #b9a1ae;
      --wine: #d9708f; --wine-ink: #1a0f1c; --gold: #d2b07a; --line: #3d2a40;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a0f1c; --paper: #24162a; --ink: #f4e7ed; --muted: #b9a1ae;
    --wine: #d9708f; --wine-ink: #1a0f1c; --gold: #d2b07a; --line: #3d2a40;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 400 1.0625rem/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 640px; margin: 0 auto;
          padding-left: max(20px, env(safe-area-inset-left, 0px));
          padding-right: max(20px, env(safe-area-inset-right, 0px)); }

  header { padding-block: 48px 0; text-align: center; }
  .polaroid { display: block; width: min(330px, 80%); height: auto; margin: 36px auto 0;
              box-shadow: 0 1px 2px color-mix(in srgb, var(--ink) 18%, transparent), 0 14px 32px -10px color-mix(in srgb, var(--ink) 35%, transparent); }
  h1 { font-family: var(--serif); font-style: italic; font-weight: 400;
       font-size: clamp(2.6rem, 11vw, 4.2rem); line-height: 1.02; letter-spacing: -0.01em;
       margin: 0; text-wrap: balance; }

  .invite { margin: 40px auto 0; padding: 8px; border: 1px solid var(--gold); background: var(--paper); }
  .invite-inner { border: 1px solid var(--gold); padding: 32px 20px 28px; text-align: center;
                  display: grid; gap: 6px; justify-items: center; }
  .invite-lead { margin: 0; color: var(--muted); font-size: .95rem; }
  .invite-date { margin: 4px 0 0; font-family: var(--serif); font-weight: 500;
                 font-size: clamp(1.7rem, 7vw, 2.3rem); line-height: 1.15; text-wrap: balance; }
  .invite-time { margin: 0; font-family: var(--serif); font-style: italic; font-size: 1.35rem; color: var(--wine); }
  .invite a { margin-top: 18px; }

  .intro { margin: 40px auto 0; max-width: 34em; text-align: center; color: var(--muted); text-wrap: pretty; }

  main { padding-block: 48px 72px; }
  h2.section { font-family: var(--serif); font-weight: 400; font-size: 1.9rem; margin: 0 0 8px; text-align: center; }
  .count { text-align: center; color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
  ol.gifts { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--gold); }
  .gift { padding: 26px 0; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  .gift:last-child { border-bottom-color: var(--gold); }
  .gift h3 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 1.45rem; line-height: 1.25; }
  .gift .note { margin: 0; color: var(--muted); white-space: pre-line; max-width: 34em; }
  .actions { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .gift.reserved h3, .gift.reserved .note { opacity: .55; }

  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
         padding: 0 22px; border-radius: 999px; font: 500 .98rem var(--sans); letter-spacing: .01em;
         text-decoration: none; cursor: pointer; border: 1px solid transparent; transition: background .2s, color .2s; }
  .btn-primary { background: var(--wine); color: var(--wine-ink); }
  .btn-primary:hover { background: color-mix(in srgb, var(--wine) 86%, var(--ink)); }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn-ghost:hover { border-color: var(--gold); }
  .btn-gold { background: transparent; color: var(--ink); border-color: var(--gold); }
  .btn-gold:hover { background: color-mix(in srgb, var(--gold) 14%, transparent); }
  .taken { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px;
           border: 1px dashed var(--gold); color: var(--gold); font: italic 500 1rem var(--serif); }
  .btn:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .status { text-align: center; color: var(--muted); padding: 32px 0; }
  footer { text-align: center; color: var(--muted); font-family: var(--serif); font-style: italic; padding-block: 0 56px; }

  dialog { border: 1px solid var(--gold); border-radius: 4px; padding: 28px 24px; max-width: 380px; width: calc(100% - 32px);
           background: var(--paper); color: var(--ink); }
  dialog::backdrop { background: color-mix(in srgb, #1a0f1c 55%, transparent); }
  dialog h4 { margin: 0 0 4px; font: 500 1.35rem/1.3 var(--serif); }
  dialog p { margin: 0; color: var(--muted); font-size: .95rem; }
  dialog label { display: block; margin-top: 18px; font-size: .95rem; }
  dialog input { width: 100%; margin: 6px 0 20px; padding: 12px 14px; border-radius: 4px; border: 1px solid var(--line);
                 font: inherit; background: var(--bg); color: var(--ink); }
  dialog .row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .error { color: var(--wine); margin: 0 0 12px; }
  #photo { padding: 0; border: 0; max-width: min(92vw, 720px); width: auto; background: transparent; }
  #photo::backdrop { background: color-mix(in srgb, #000 85%, transparent); }
  #photo img { display: block; max-width: 100%; max-height: 82vh; }
  #photo .row { justify-content: center; margin-top: 14px; }
  #photo .btn-ghost { color: #fff; border-color: #ffffff66; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <img class="polaroid" src="fotos/portada.jpg" width="1024" height="1536" alt="Dianita con su perrita">
    <section class="invite" aria-label="Detalles de la fiesta">
      <div class="invite-inner">
        <p class="invite-lead">Te espero para celebrar</p>
        <p class="invite-date" id="partyDate"></p>
        <p class="invite-time" id="partyTime"></p>
        <a class="btn btn-gold" id="partyMap" target="_blank" rel="noopener">Ver ubicación</a>
      </div>
    </section>
    <p class="intro" id="subtitle"></p>
  </header>

  <main>
    <h2 class="section">Ideas de regalo</h2>
    <p class="count" id="count"></p>
    <ol class="gifts" id="list"><li class="status">Cargando regalos…</li></ol>
  </main>

  <footer>Gracias por estar 🤍</footer>
</div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h4 id="dlgTitle"></h4>
    <p>Así nadie más lo compra.</p>
    <label for="who">Tu nombre</label>
    <input id="who" autocomplete="name" placeholder="Solo lo verán Sergio y Chan" required maxlength="60">
    <p class="error" id="dlgError" hidden></p>
    <div class="row">
      <button type="button" class="btn btn-ghost" id="cancel">Cancelar</button>
      <button type="submit" class="btn btn-primary" id="confirm">Apartar</button>
    </div>
  </form>
</dialog>

<dialog id="photo">
  <img id="photoImg" alt="">
  <div class="row"><button type="button" class="btn btn-ghost" id="photoClose">Cerrar</button></div>
</dialog>

<script>
// ===== Edita esto =====
const CONFIG = {
  title: "Mi Lista de Cumpleaños",
  subtitle: "Tu compañía es el mejor regalo. Si además quieres darme algo, aquí tienes algunas ideas. Toca “Apartar” en la que elijas para que nadie compre la misma.",
  // Pega aquí la URL de tu Web App de Google Apps Script (ver README):
  partyDate: "Sábado 21 de noviembre",
  partyTime: "7:00 p. m.",
  partyMap: "https://maps.app.goo.gl/qF1cboh3zKfUP5rN8",
  apiUrl: "https://script.google.com/macros/s/AKfycbxjgFOp0SCCSRU13LMbXxntEBHUagSxJtaIge0oU_WdegVRxAl4nQwGmLdedVysJzy48g/exec",
};

// Tus regalos. Cada uno necesita un id único que nunca cambie.
const GIFTS = [
  { id: "mantequilla-corporal", name: "Mantequilla corporal", link: "https://www.virensyala.com/products/mantequilla-corporal-esencia-de-la-diosa", image: "", note: "Me encanta cuidarme la piel, y esta huele a rosas 🌹" },
  { id: "camiseta-bayern", name: "Camiseta Bayern Luis Díaz", link: "", image: "fotos/camiseta-bayern.jpg", note: "Para alentar a Lucho en cada partido ⚽" },
  { id: "soma-sculpt", name: "Fibra Soma Sculpt", link: "https://usasoma.com/products/soma-sculpt?variant=45650513952825", image: "", note: "Para cuidarme por dentro también 💪\n🎁 Tiene 5% de descuento en tu primera compra." },
  { id: "cojin-lumbar", name: "Cojín lumbar", link: "https://articulo.mercadolibre.com.co/MCO-1503556883?attributes=Negro_47aa3ad_vpp:R3Jpcw==", image: "", note: "Para cuidar mi espalda en las largas horas de trabajo 💺" },
  { id: "sudadera", name: "Pantalón sudadera bota recta", link: "https://confetexdecolombia.com/products/pantalon-de-dama-ref-489?variant=45794416886004", image: "", note: "Para entrenar cómoda y con estilo 🏃‍♀️\n📏 Talla 8" },
  { id: "tetera", name: "Tetera de hierro", link: "https://casaherbolaria.com.co/products/tetera-hierro-negra-premiun-negra-300-ml", image: "", note: "Para mis tardes de té y aromática 🍵\n🎁 Incluye una bolsa de té de 50 g gratis." },
  { id: "cadena-aretes-plata", name: "Juego de cadena y aretes en plata", link: "", image: "", note: "Para brillar todos los días ✨" },
  { id: "tablero-acrilico", name: "Tablero acrílico", link: "https://www.mercadolibre.com.co/p/MCO53285437?pdp_filters=item_id:MCO2983996664", image: "", note: "Para organizar mis ideas y pendientes 📝" },
  { id: "libro", name: "Un buen libro", link: "https://www.instagram.com/p/DNwiI7t2p25/", linkLabel: "Sugerencias", image: "", note: "Porque las mujeres que leen, crecen sin límites ✨" },
  { id: "bonsai", name: "Mini bonsái", link: "https://www.habibiplantitas.com/products/mini-bonsai-pino-sakura-matera-blanca", image: "", note: "Para darle vida a mi sala, prometo cuidarlo 🌱" },
  { id: "pijama-seda-fria", name: "Pijama de seda fría", link: "https://atina.com.co", image: "", note: "Para descansar cómoda y bonita 🌙\n📏 Talla M" },
  { id: "kit-aromaterapia", name: "Kit de aromaterapia", link: "https://terramartecya.com/products/kit-bienestar-natural", image: "", note: "Para despertar con frescura, crear con alegría y cerrar el día en calma 🌿" },
  { id: "dia-de-spa", name: "Día de spa", link: "https://www.instagram.com/reel/DDxxDgasC9X/", linkLabel: "Sugerencia", image: "", note: "Para desconectarme y relajarme por completo 💆‍♀️" },
  { id: "protectores-auditivos", name: "Protectores auditivos", link: "https://zenplug.co/productos/zenplug-infinity/", image: "", note: "Para dormir sin escuchar los ronquidos de Sergio 😴\n🎁 Tiene 10% de descuento en tu primera compra." },
  { id: "vino", name: "Una buena botella de vino", link: "https://www.jumbocolombia.com/vino-tinto-protos-roble-ribera-duero-750ml-8362/p?idsku=8362", image: "", note: "Para acompañar una buena cena y mejor compañía 🍷" },
];
// =======================

document.getElementById("title").textContent = CONFIG.title;
document.getElementById("subtitle").textContent = CONFIG.subtitle;
document.getElementById("partyDate").textContent = CONFIG.partyDate;
document.getElementById("partyTime").textContent = CONFIG.partyTime;
document.getElementById("partyMap").href = CONFIG.partyMap;
const list = document.getElementById("list");
const dlg = document.getElementById("dlg");
let current = null;

const localReserved = new Set();

async function load() {
  let reserved = new Set(localReserved);
  if (CONFIG.apiUrl) {
    try {
      const r = await fetch(CONFIG.apiUrl + "?action=list");
      const data = await r.json();
      (data.reserved || []).forEach(id => reserved.add(String(id)));
    } catch (e) {
      list.innerHTML = '<li class="status">No se pudo cargar la lista. Recarga la página para intentar de nuevo.</li>';
      return;
    }
  }
  render(GIFTS.map(g => ({ ...g, reserved: reserved.has(String(g.id)) })));
}

function render(items) {
  list.innerHTML = "";
  if (!items.length) { list.innerHTML = '<li class="status">Todavía no hay regalos.</li>'; return; }
  const free = items.filter(i => !i.reserved).length;
  document.getElementById("count").textContent = free === items.length
    ? items.length + " ideas"
    : free + " de " + items.length + " disponibles";
  for (const it of items) {
    const li = document.createElement("li");
    li.className = "gift" + (it.reserved ? " reserved" : "");
    const h = document.createElement("h3"); h.textContent = it.name; li.appendChild(h);
    if (it.note) { const p = document.createElement("p"); p.className = "note"; p.textContent = it.note; li.appendChild(p); }
    const actions = document.createElement("div"); actions.className = "actions";
    if (it.reserved) {
      const t = document.createElement("span"); t.className = "taken"; t.textContent = "Apartado"; actions.appendChild(t);
    } else {
      const b = document.createElement("button");
      b.type = "button"; b.className = "btn btn-primary"; b.textContent = "Apartar";
      b.onclick = () => openReserve(it);
      actions.appendChild(b);
    }
    if (it.link) {
      const a = document.createElement("a"); a.className = "btn btn-ghost"; a.href = it.link;
      a.target = "_blank"; a.rel = "noopener"; a.textContent = it.linkLabel || "Ver";
      actions.appendChild(a);
    } else if (it.image) {
      const a = document.createElement("a"); a.className = "btn btn-ghost"; a.href = it.image;
      a.textContent = "Ver";
      a.onclick = (e) => { e.preventDefault(); showPhoto(it); };
      actions.appendChild(a);
    }
    li.appendChild(actions);
    list.appendChild(li);
  }
}

const dlgError = document.getElementById("dlgError");
function openReserve(it) {
  current = it;
  document.getElementById("dlgTitle").textContent = "Apartar “" + it.name + "”";
  dlgError.hidden = true;
  dlg.showModal();
}

document.getElementById("cancel").onclick = () => dlg.close();

const photo = document.getElementById("photo");
function showPhoto(it) {
  const img = document.getElementById("photoImg");
  img.src = it.image; img.alt = it.name;
  photo.showModal();
}
document.getElementById("photoClose").onclick = () => photo.close();
photo.addEventListener("click", (e) => { if (e.target === photo) photo.close(); });
document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const who = document.getElementById("who").value.trim();
  if (!who || !current) return;
  const btn = document.getElementById("confirm");
  if (!CONFIG.apiUrl) { localReserved.add(String(current.id)); dlg.close(); return load(); }
  btn.disabled = true; btn.textContent = "Apartando…";
  try {
    const url = CONFIG.apiUrl + "?action=reserve&id=" + encodeURIComponent(current.id) + "&who=" + encodeURIComponent(who);
    const r = await fetch(url);
    const data = await r.json();
    if (data.ok || data.error === "taken") {
      dlg.close();
    } else {
      dlgError.textContent = "No se pudo apartar. Revisa tu conexión e intenta de nuevo."; dlgError.hidden = false;
    }
  } catch (err) {
    dlgError.textContent = "No se pudo apartar. Revisa tu conexión e intenta de nuevo."; dlgError.hidden = false;
  }
  btn.disabled = false; btn.textContent = "Apartar";
  load();
};

load();
</script>
</body>
</html>
